<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fundo Executivo Obsidian Dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="45%" stop-color="#181822"/>
      <stop offset="100%" stop-color="#232332"/>
    </linearGradient>

    <!-- Gradiente de Borda Coral Gomex -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ed8570" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ed8570" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Gradiente do Caminhão e Elementos -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ed8570"/>
    </linearGradient>

    <!-- Sombra e Brilho do Ícone -->
    <filter id="pwaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ed8570" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fundo do Ícone de Aplicativo (Squircle Moderno PWA / Android / iOS) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="5"/>

  <!-- Emblema Central: Caminhão da Frota Gomex com Linhas de Precisão Executiva -->
  <g transform="translate(86, 82) scale(14.2)" filter="url(#pwaGlow)">
    <!-- Carroceria e Cabine -->
    <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" fill="none" stroke="url(#coralGrad)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 18H9" stroke="url(#coralGrad)" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14" fill="none" stroke="url(#coralGrad)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Janela da Cabine com reflexo sutil -->
    <path d="M14 8h3.2l2.4 3H14V8z" fill="rgba(237, 133, 112, 0.28)" stroke="none"/>

    <!-- Rodas Reforçadas -->
    <circle cx="7" cy="18.5" r="2.8" fill="#16161c" stroke="url(#coralGrad)" stroke-width="1.8"/>
    <circle cx="7" cy="18.5" r="1.2" fill="#ed8570"/>

    <circle cx="17" cy="18.5" r="2.8" fill="#16161c" stroke="url(#coralGrad)" stroke-width="1.8"/>
    <circle cx="17" cy="18.5" r="1.2" fill="#ed8570"/>
  </g>
</svg>
