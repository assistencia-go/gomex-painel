  <!-- ========================================================================== -->
  <!-- MODAL: SUBIR FOTO NA GALERIA DO VEÍCULO -->
  <!-- ========================================================================== -->
  <div class="modal-overlay" id="modalSubirFotoGaleria">
    <div class="modal-card" style="max-width:680px;width:96%">
      <header class="modal-head">
        <div style="display:flex;align-items:center;gap:12px">
          <div
            style="width:36px;height:36px;border-radius:8px;background:var(--accent-tint);color:var(--accent-hi);display:grid;place-items:center">
            <svg class="i" style="width:20px;height:20px">
              <use href="#i-camera" />
            </svg>
          </div>
          <div>
            <h3 style="font-size:16px;font-weight:700">Subir Foto na Galeria do Veículo</h3>
            <p style="font-size:12px;color:var(--ink-3);margin-top:2px">Anexe fotos encaminhadas pelo motorista com
              data, placa e identificação do condutor</p>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-icon" onclick="fecharModalSubirFoto()"><svg class="i">
            <use href="#i-x" />
          </svg></button>
      </header>

      <div class="modal-body" style="padding:20px;display:grid;gap:14px;max-height:78vh;overflow-y:auto">
        <!-- Input oculto separado da dropzone para evitar propagação recursiva de clique -->
        <input type="file" id="galFileInput" accept="image/*" multiple hidden
          onchange="onSelecionarArquivosGaleria(this.files)">

        <!-- Área de Upload (Clique, Arraste ou Cole Ctrl+V direto do WhatsApp) -->
        <div class="upload-dropzone" id="galDropzone" onclick="acionarSeletorFotosGaleria()">
          <div
            style="width:44px;height:44px;border-radius:50%;background:var(--accent-tint);color:var(--accent-hi);display:grid;place-items:center;margin:0 auto 8px">
            <svg class="i" style="width:22px;height:22px">
              <use href="#i-camera" />
            </svg>
          </div>
          <div style="font-size:13.5px;font-weight:700;color:var(--ink)">Clique aqui para escolher 1 ou várias fotos (ou
            arraste os arquivos)</div>
          <div style="font-size:12px;color:var(--ink-3);margin-top:3px">Você também pode copiar as fotos do WhatsApp e
            pressionar <strong>Ctrl + V</strong> várias vezes nesta janela</div>
          <div style="margin-top:10px">
            <button type="button" class="btn btn-primary" style="height:32px;font-size:12px;padding:0 14px"
              onclick="event.stopPropagation(); acionarSeletorFotosGaleria()">
              <svg class="i" style="width:14px;height:14px">
                <use href="#i-plus" />
              </svg>
              <span id="galBtnEscolherLabel">Escolher Fotos do Computador</span>
            </button>
          </div>

          <!-- Barra de status e botão de adicionar mais fotos quando já houver fotos anexadas -->
          <div id="galUploadStatusHeader" hidden onclick="event.stopPropagation()"
            style="display:none;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-strong);flex-wrap:wrap">
            <span id="galUploadCountText" style="font-size:12px;font-weight:700;color:#34d399">0 fotos anexadas</span>
            <div style="display:flex;gap:6px">
              <button type="button" class="btn"
                style="height:28px;font-size:11.5px;padding:0 10px;border-color:var(--accent);color:var(--accent-hi)"
                onclick="event.stopPropagation(); acionarSeletorFotosGaleria()">
                <svg class="i" style="width:12px;height:12px">
                  <use href="#i-plus" />
                </svg>
                <span>Adicionar Mais Fotos</span>
              </button>
              <button type="button" class="btn btn-ghost"
                style="height:28px;font-size:11.5px;padding:0 8px;color:var(--bad)"
                onclick="event.stopPropagation(); limparUploadsDraftGaleria()">
                Limpar todas
              </button>
            </div>
          </div>

          <div class="upload-preview-grid" id="galUploadPreviewGrid" hidden onclick="event.stopPropagation()"
            style="display:none"></div>
        </div>

        <!-- Linha 1: Placa, Modelo, Data da Foto -->
        <div class="gasto-form-grid-3">
          <div>
            <label for="galInputPlaca" class="gasto-field-lbl" style="color:var(--accent-hi)">Placa do Veículo *</label>
            <input type="text" id="galInputPlaca" list="datalistPlacasFrota" class="input" placeholder="Ex: ABC1234"
              maxlength="8" style="height:38px;font-weight:800;text-transform:uppercase"
              oninput="this.value=this.value.toUpperCase(); onDigitarPlacaNoModalGaleria(this.value)"
              onchange="onDigitarPlacaNoModalGaleria(this.value)">
          </div>
          <div>
            <label for="galInputVeiculo" class="gasto-field-lbl">Modelo do Veículo</label>
            <input type="text" id="galInputVeiculo" class="input" placeholder="Modelo do veículo" style="height:38px">
          </div>
          <div>
            <label for="galInputData" class="gasto-field-lbl">Data da Foto *</label>
            <input type="date" id="galInputData" class="input" style="height:38px;font-weight:600">
          </div>
        </div>

        <!-- Linha 2: Qual era o Motorista, Categoria e KM -->
        <div class="gasto-form-grid-3">
          <div>
            <label for="galInputMotorista" class="gasto-field-lbl" style="color:var(--ink)">Qual era o Motorista
              *</label>
            <input type="text" id="galInputMotorista" list="datalistMotoristasFrota" class="input"
              placeholder="Nome do motorista" style="height:38px;font-weight:600">
          </div>
          <div>
            <label for="galInputCategoria" class="gasto-field-lbl">Categoria / Momento</label>
            <select id="galInputCategoria" class="input" style="height:38px">
              <option value="Estado Geral / Vistoria">Estado Geral / Vistoria</option>
              <option value="Saída / Retorno de Rota">Saída / Retorno de Rota</option>
              <option value="Peça Trocada / Manutenção">Peça Trocada / Manutenção</option>
              <option value="Avaria / Carroceria">Avaria / Carroceria</option>
              <option value="Pneus / Calibragem">Pneus / Calibragem</option>
              <option value="Painel / Hodômetro (KM)">Painel / Hodômetro (KM)</option>
              <option value="Nota Fiscal / Comprovante">Nota Fiscal / Comprovante</option>
              <option value="Outros">Outros</option>
            </select>
          </div>
          <div>
            <label for="galInputKm" class="gasto-field-lbl">KM do Veículo (Opcional)</label>
            <input type="number" id="galInputKm" class="input" placeholder="Quilometragem" style="height:38px">
          </div>
        </div>

        <!-- Linha 3: Observação / Detalhes da foto -->
        <div>
          <label for="galInputObs" class="gasto-field-lbl">Informações / Observação da Foto</label>
          <input type="text" id="galInputObs" class="input"
            placeholder="Informe detalhes sobre a foto encaminhada pelo motorista" style="height:38px">
        </div>
      </div>

      <footer class="modal-foot" style="display:flex;justify-content:space-between;align-items:center">
        <button type="button" class="btn" onclick="fecharModalSubirFoto()">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnSalvarFotoGaleria" onclick="salvarFotosGaleria()">
          <svg class="i">
            <use href="#i-check" />
          </svg>
          <span>Salvar na Galeria do Veículo</span>
        </button>
      </footer>
    </div>
  </div>
