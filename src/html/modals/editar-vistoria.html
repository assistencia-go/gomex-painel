  <!-- ========================================================================== -->
  <!-- MODAL DE EDIÇÃO DE VISTORIA & ROTA -->
  <!-- ========================================================================== -->
  <div class="modal-overlay" id="modalEditarVistoria">
    <div class="modal-card" style="max-width:680px;width:95%">
      <header class="modal-head">
        <div style="display:flex;align-items:center;gap:12px">
          <div
            style="width:36px;height:36px;border-radius:8px;background:var(--accent-tint);color:var(--accent-hi);display:grid;place-items:center">
            <svg class="i" style="width:20px;height:20px">
              <use href="#i-edit" />
            </svg>
          </div>
          <div>
            <h3 style="font-size:16px;font-weight:700">Editar Vistoria Nº <span id="mEditNumero">000000</span></h3>
            <p style="font-size:12px;color:var(--ink-3);margin-top:2px">Altere rota, vendedor, veículo, quilometragem ou
              parecer</p>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-icon" onclick="fecharModalEditarVistoria()"><svg class="i">
            <use href="#i-x" />
          </svg></button>
      </header>
      <div class="modal-body" style="padding:20px;display:grid;gap:16px;max-height:75vh;overflow-y:auto">
        <input type="hidden" id="editVistoriaId">

        <!-- DESTAQUE PRINCIPAL: ROTA DO VENDEDOR -->
        <div class="rota-highlight-box">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <label for="editRota"
              style="font-size:13px;font-weight:700;color:var(--accent-hi);display:flex;align-items:center;gap:6px">
              <span>Rota do Vendedor:</span>
            </label>
          </div>
          <input type="text" class="input" id="editRota"
            style="height:40px;font-weight:700;font-size:14px;background:var(--bg)">
        </div>

        <!-- MOTORISTA E VEÍCULO -->
        <div class="edit-grid-2">
          <div>
            <label for="editMotorista"
              style="font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px;display:block">
              Motorista / Vendedor *:
            </label>
            <input type="text" class="input" id="editMotorista" placeholder="Nome completo do condutor"
              style="height:38px">
          </div>
          <div>
            <label for="editPlaca"
              style="font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px;display:block">
              Placa do Veículo *:
            </label>
            <input type="text" class="input" id="editPlaca" placeholder="Ex: ABC1234" maxlength="8"
              style="height:38px;font-weight:800;text-transform:uppercase">
          </div>
        </div>

        <div class="edit-grid-2">
          <div>
            <label for="editVeiculo"
              style="font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px;display:block">
              Modelo do Veículo:
            </label>
            <input type="text" class="input" id="editVeiculo" placeholder="Ex: Fiorino, Kangoo, Master..."
              style="height:38px">
          </div>
          <div>
            <label for="editKm"
              style="font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px;display:block">
              Quilometragem (KM) Atual:
            </label>
            <input type="number" class="input" id="editKm" placeholder="Ex: 85200" style="height:38px">
          </div>
        </div>

        <!-- DATA, HORA, TIPO, COMBUSTÍVEL -->
        <div class="edit-grid-2">
          <div>
            <label for="editData"
              style="font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px;display:block">
              Data da Vistoria:
            </label>
            <input type="date" class="input" id="editData" style="height:38px">
          </div>
          <div>
            <label for="editHora"
              style="font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px;display:block">
              Hora da Vistoria:
            </label>
            <input type="time" class="input" id="editHora" style="height:38px">
          </div>
        </div>

        <div class="edit-grid-2">
          <div>
            <label for="editTipo"
              style="font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px;display:block">
              Tipo de Vistoria:
            </label>
            <select class="input" id="editTipo" style="height:38px">
              <option value="Saída">Saída</option>
              <option value="Retorno">Retorno</option>
              <option value="Periódica">Periódica</option>
            </select>
          </div>
          <div>
            <label for="editCombustivel"
              style="font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px;display:block">
              Nível de Combustível:
            </label>
            <select class="input" id="editCombustivel" style="height:38px">
              <option value="Reserva">Reserva</option>
              <option value="1/4">1/4</option>
              <option value="1/2">1/2</option>
              <option value="3/4">3/4</option>
              <option value="Cheio">Cheio</option>
            </select>
          </div>
        </div>

        <!-- LIBERAÇÃO E OBSERVAÇÕES -->
        <div class="edit-grid-2">
          <div>
            <label for="editLiberacao"
              style="font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px;display:block">
              Situação da Vistoria:
            </label>
            <select class="input" id="editLiberacao" style="height:38px;font-weight:700">
              <option value="Liberado">Liberado</option>
              <option value="Ressalva">Com Ressalva</option>
              <option value="Não liberado">Não Liberado (Bloqueado)</option>
            </select>
          </div>
          <div>
            <label for="editCondicao"
              style="font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px;display:block">
              Condição do Motorista:
            </label>
            <select class="input" id="editCondicao" style="height:38px">
              <option value="Apto">Apto</option>
              <option value="Cansado">Cansado</option>
            </select>
          </div>
        </div>

        <div>
          <label for="editObs"
            style="font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px;display:block">
            Observações Gerais / Parecer:
          </label>
          <textarea class="approval-textarea" id="editObs" style="min-height:75px"
            placeholder="Observações da vistoria, notas operacionais, etc."></textarea>
        </div>
      </div>
      <footer class="modal-foot" style="display:flex;justify-content:space-between;align-items:center">
        <button type="button" class="btn" onclick="fecharModalEditarVistoria()">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnSalvarEdicaoVistoria"
          onclick="salvarEdicaoVistoria(false)">
          <svg class="i">
            <use href="#i-check" />
          </svg> Salvar Alterações
        </button>
      </footer>
    </div>
  </div>
