  <!-- ========================================================================== -->
  <!-- MODAL DE TRANSIÇÃO E COMPARATIVO DE CUSTÓDIA -->
  <!-- ========================================================================== -->
  <div class="modal-overlay" id="modalCustodiaVeiculo">
    <div class="modal-card" style="max-width:880px;width:95%">
      <header class="modal-head">
        <div style="display:flex;align-items:center;gap:12px">
          <div
            style="width:36px;height:36px;border-radius:8px;background:var(--accent-tint);color:var(--accent-hi);display:grid;place-items:center">
            <svg class="i" style="width:20px;height:20px">
              <use href="#i-history" />
            </svg>
          </div>
          <div>
            <h3 style="font-size:16px;font-weight:700">Rastreio de Custódia & Troca de Motoristas</h3>
            <p style="font-size:12px;color:var(--ink-3);margin-top:2px">Auditoria de avarias entre vendedores para
              identificar a origem dos danos</p>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-icon" onclick="fecharModalCustodia()"><svg class="i">
            <use href="#i-x" />
          </svg></button>
      </header>
      <div class="modal-body" style="padding:20px;display:grid;gap:16px;max-height:75vh;overflow-y:auto">
        <!-- Seletor de Veículo para Auditoria -->
        <div
          style="display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--raised);padding:12px 16px;border-radius:8px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:10px">
            <label for="selectCustodiaPlaca" style="font-size:13px;font-weight:700;color:var(--ink)">Filtrar
              Veículo:</label>
            <select id="selectCustodiaPlaca" class="input" style="height:34px;width:200px;font-weight:700"
              onchange="renderModalCustodiaConteudo(this.value)">
              <option value="">Todos os Veículos</option>
            </select>
          </div>
          <div id="custodiaTransCountBadge" style="font-size:12px;color:var(--ink-2);font-weight:600">
            Carregando transições...
          </div>
        </div>

        <!-- Container das Transições / Comparações -->
        <div id="custodiaTransicoesContainer" style="display:grid;gap:16px">
          <!-- Preenchido via JS com os comparativos Antes vs Depois -->
        </div>
      </div>
      <footer class="modal-foot">
        <button type="button" class="btn" onclick="fecharModalCustodia()">Fechar</button>
      </footer>
    </div>
  </div>
