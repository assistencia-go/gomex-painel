  <!-- ========================================================================== -->
  <!-- MODAL GLOBAL DE CONFIRMAÇÃO (CUSTOM IN-APP MODAL PARA TODOS OS BOTÕES) -->
  <!-- ========================================================================== -->
  <div class="modal-overlay" id="modalConfirmacaoGlobal" style="z-index:99999">
    <div class="modal-card" style="max-width:440px;width:95%">
      <header class="modal-head" style="border-bottom:1px solid var(--line);padding:16px 20px">
        <div style="display:flex;align-items:center;gap:10px">
          <div id="modalConfirmacaoGlobalIcoWrapper"
            style="width:38px;height:38px;border-radius:8px;background:rgba(250,138,138,0.15);color:var(--bad);display:grid;place-items:center">
            <svg class="i" id="modalConfirmacaoGlobalIco" style="width:20px;height:20px"><use id="modalConfirmacaoGlobalIcoUse" href="#i-trash" /></svg>
          </div>
          <div>
            <h3 id="modalConfirmacaoGlobalTitulo" style="font-size:16px;font-weight:700">Confirmação</h3>
            <p id="modalConfirmacaoGlobalSubtitulo" style="font-size:12px;color:var(--ink-3);margin-top:2px">Ação de segurança</p>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-icon" onclick="responderConfirmacaoGlobal(false)">
          <svg class="i"><use href="#i-x" /></svg>
        </button>
      </header>

      <div class="modal-body" style="padding:20px;display:grid;gap:14px">
        <p style="font-size:13.5px;color:var(--ink);line-height:1.5" id="modalConfirmacaoGlobalTexto">
          Deseja realmente continuar?
        </p>
        <div id="modalConfirmacaoGlobalAviso" style="padding:10px 14px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--ink-3)">
          Esta operação não poderá ser desfeita.
        </div>
      </div>

      <footer style="padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--panel-2)">
        <button type="button" class="btn btn-ghost" onclick="responderConfirmacaoGlobal(false)" id="btnModalConfirmacaoGlobalCancelar">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnModalConfirmacaoGlobalConfirmar"
          style="background:#dc2626;border-color:#b91c1c" onclick="responderConfirmacaoGlobal(true)">
          <svg class="i" id="modalConfirmacaoGlobalBtnIco"><use id="modalConfirmacaoGlobalBtnIcoUse" href="#i-trash" /></svg>
          <span id="modalConfirmacaoGlobalBtnTexto">Confirmar</span>
        </button>
      </footer>
    </div>
  </div>
